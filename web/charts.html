<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charts & Analytics | Rajapeta Watershed</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: #f0f2f5; color: #1a1a1a; }
    .charts-page { overflow-y: auto; padding: 20px 24px 60px; height: 100%; }

    .ch-section { margin-bottom: 28px; }
    .ch-sec-title {
      font-size: 11px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: #1a73e8;
      border-bottom: 2px solid #d2e3fc; padding-bottom: 7px; margin-bottom: 14px;
    }
    .ch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
      gap: 16px;
    }
    .ch-card {
      background: #fff; border: 1px solid #e0e0e0;
      border-radius: 8px; padding: 16px 18px;
      box-shadow: 0 1px 3px rgba(0,0,0,.07);
    }
    .ch-card.wide { grid-column: 1 / -1; }
    .ch-card-title { font-size: 13px; font-weight: 700; color: #111; margin-bottom: 3px; }
    .ch-card-note  { font-size: 11px; color: #666; margin-bottom: 10px; line-height: 1.5; }
    .ch-box  { position: relative; width: 100%; height: 300px; }
    .ch-empty {
      font-size: 12px; color: #888; background: #fafafa;
      border: 1px dashed #ccc; border-radius: 6px;
      padding: 22px 14px; text-align: center; line-height: 1.6;
    }

    /* change summary bars */
    .chg-bars { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .chg-bar-item { flex: 1 1 120px; border-radius: 6px; padding: 12px 10px; text-align: center; }
    .chg-bar-item .val { font-size: 20px; font-weight: 700; }
    .chg-bar-item .lbl { font-size: 11px; margin-top: 3px; }
    .chg-inc { background: #e8f5e9; color: #1b5e20; }
    .chg-stb { background: #f5f5f5; color: #555; }
    .chg-dec { background: #ffebee; color: #b71c1c; }

    /* Tables */
    .ch-tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
    .ch-tbl thead { background: #e8f0fe; }
    .ch-tbl th {
      padding: 9px 12px; text-align: right;
      font-size: 10px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: #1a73e8;
      border-bottom: 2px solid #c5d8f8;
    }
    .ch-tbl th:first-child { text-align: left; }
    .ch-tbl td {
      padding: 8px 12px; text-align: right;
      color: #333; border-bottom: 1px solid #f0f0f0;
      font-variant-numeric: tabular-nums;
    }
    .ch-tbl td:first-child { text-align: left; }
    .ch-tbl tbody tr:hover td { background: #f5f8ff; }
    .ch-tbl tbody tr:last-child td { border-bottom: none; }
    .tbl-name { color: #111 !important; font-weight: 600; }
    .pos { color: #2e7d32 !important; font-weight: 700; }
    .neg { color: #c62828 !important; font-weight: 700; }

    #notice {
      background: #fff3cd; border: 1px solid #ffc107; color: #856404;
      padding: 10px 16px; border-radius: 6px; font-size: 13px;
      margin-bottom: 16px; display: none;
    }
    @media (max-width: 900px) { .ch-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Rajapeta Watershed GIS<small>Wanaparthy, Telangana · 2004–2024</small></div>
    <nav>
      <a href="/ndvi">NDVI</a>
      <a href="/lst">LST</a>
      <a href="/lulc">LULC</a>
      <a href="/llm-report">LLM Report</a>
      <a class="active" href="/charts">Charts</a>
    </nav>
  </header>
  <div class="charts-page">
    <div id="notice"></div>
    <div id="charts"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/charts.js"></script>
</body>
</html>
